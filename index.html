<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRINEPLAY</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{background:#080808;color:white;font-family:Arial;text-align:center;margin:0}
header{padding:25px;color:gold;font-size:32px;font-weight:bold}
.box{background:#191919;margin:15px;padding:25px;border:1px solid gold;border-radius:15px}
h2{color:gold}
button{background:linear-gradient(90deg,gold,#b8860b);padding:14px;border:0;border-radius:10px;font-weight:bold;margin:5px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.game{background:#191919;border:1px solid #aa852d;border-radius:12px;padding:20px}
</style>
</head>
<body>
<header>👑 TRINEPLAY</header>
<div class="box">
<p>ТВІЙ БАЛАНС</p>
<h2><span id="balance">1000</span> ₴</h2>
<button onclick="add()">＋ Поповнити</button>
<button onclick="withdraw()">− Вивести</button>
</div>
<h2>🎮 ІГРИ</h2>
<div class="games">
<div class="game">🎰<p>Слоти</p><button onclick="play()">Грати</button></div>
<div class="game">💣<p>Mines</p><button onclick="play()">Грати</button></div>
<div class="game">🎲<p>Dice</p><button onclick="play()">Грати</button></div>
<div class="game">🎡<p>Колесо</p><button onclick="play()">Грати</button></div>
</div>
<p id="result">Вітаємо у TRINEPLAY!</p>
<script>
let balance=1000;
function update(){document.getElementById('balance').textContent=balance}
function add(){balance+=100;update();alert('Додано 100 віртуальних балів')}
function withdraw(){alert('Демо: реальні виплати недоступні')}
function play(){
if(balance<10){alert('Недостатньо балів');return}
balance-=10;
let win=Math.random()<0.45;
if(win)balance+=30;
update();
document.getElementById('result').textContent=win?'🎉 Виграш!':'😢 Спробуй ще!';
}
</script>
</body>
</html>
